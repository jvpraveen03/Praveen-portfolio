<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="login-box">

        <h1>Admin Dashboard</h1>

        <p>Welcome, Admin 👋</p>

        <hr>

        <h2>Upload Video</h2>

        <form method="POST"
              action="/upload"
              enctype="multipart/form-data">

            <label>Select Video</label>

            <input
                type="file"
                name="video"
                accept="video/*"
                required
            >

            <button type="submit">
                Upload Video
            </button>

        </form>

        <br>

        <a href="/">
            ← View Portfolio
        </a>

    </div>

</body>
</html>
